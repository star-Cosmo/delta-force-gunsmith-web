<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲行动 - 改枪工坊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="logo">三角洲行动 · 改枪工坊</h1>
            <span class="version">v0.1.0 Alpha</span>
        </div>
    </header>

    <main class="main">
        <aside class="sidebar">
            <h2 class="sidebar-title">选择枪械</h2>
            <div class="weapon-list" id="weaponList"></div>
        </aside>

        <section class="content">
            <div class="weapon-info" id="weaponInfo">
                <h2 class="weapon-name">请选择一把枪械</h2>
                <p class="weapon-type">—</p>
            </div>

            <div class="stats-section">
                <h3 class="section-title">属性调整（拖动滑块设定目标值）</h3>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="btnAutoBuild" disabled>自动选配配件</button>
                <button class="btn btn-secondary" id="btnReset" disabled>重置属性</button>
            </div>
        </section>

        <aside class="result">
            <h2 class="result-title">改装方案</h2>
            <div class="attachments-list" id="attachmentsList">
                <p class="placeholder">选择枪械并调整属性后，点击"自动选配配件"</p>
            </div>
            <div class="code-section">
                <h3 class="section-title">改枪码</h3>
                <div class="code-output" id="codeOutput">
                    <span class="code-placeholder">—</span>
                </div>
                <button class="btn btn-copy" id="btnCopyCode" disabled>复制改枪码</button>
            </div>
        </aside>
    </main>

    <footer class="footer">
        <p>三角洲行动改枪工坊 · 仅供学习研究使用 · 数据基于游戏公开信息</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
