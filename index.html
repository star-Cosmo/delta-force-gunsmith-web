<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>三角洲行动 · 改枪工坊</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <i class="fas fa-crosshairs logo-icon"></i>
            <h1>改枪工坊</h1>
        </div>
        <div class="header-right">
            <a href="wiki.html" class="btn-wiki" title="配件百科"><i class="fas fa-book"></i> 配件百科</a>
            <span class="badge">AI 智能选配</span>
            <span class="version">v2.0</span>
        </div>
    </header>

    <main class="app-main">
        <section class="weapon-select-section">
            <h2 class="section-label"><i class="fas fa-gun"></i> 选择枪械 <span class="weapon-count" id="weaponCount"></span></h2>
            <div class="weapon-search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="weaponSearch" placeholder="搜索武器名称...">
            </div>
            <div class="weapon-filter-tabs" id="weaponFilterTabs">
                <button class="filter-tab active" data-type="all">全部</button>
                <button class="filter-tab" data-type="步枪">步枪</button>
                <button class="filter-tab" data-type="冲锋枪">冲锋枪</button>
                <button class="filter-tab" data-type="狙击步枪">狙击步枪</button>
                <button class="filter-tab" data-type="精确射手步枪">精确射手步枪</button>
                <button class="filter-tab" data-type="霰弹枪">霰弹枪</button>
                <button class="filter-tab" data-type="轻机枪">轻机枪</button>
                <button class="filter-tab" data-type="手枪">手枪</button>
                <button class="filter-tab" data-type="特殊武器">特殊武器</button>
            </div>
            <div class="weapon-grid" id="weaponGrid"></div>
        </section>

        <section class="weapon-info-card" id="weaponInfoCard" style="display:none;">
            <div class="weapon-icon-large" id="weaponIcon">🔫</div>
            <div class="weapon-meta">
                <h3 id="weaponName">—</h3>
                <p id="weaponType">—</p>
                <div class="weapon-tags" id="weaponTags"></div>
            </div>
        </section>

        <section class="stats-panel" id="statsPanel" style="display:none;">
            <h2 class="section-label"><i class="fas fa-sliders"></i> 目标属性 <span class="hint">拖动调节</span></h2>
            <div class="stats-list" id="statsList"></div>
        </section>

        <section class="tuning-panel" id="tuningPanel" style="display:none;">
            <h2 class="section-label"><i class="fas fa-wrench"></i> 精校微调</h2>
            <div class="tuning-list" id="tuningList"></div>
        </section>

        <section class="action-panel" id="actionPanel" style="display:none;">
            <button class="btn-ai" id="btnAnalyze">
                <i class="fas fa-robot"></i>
                <span>AI 智能分析并选配</span>
            </button>
            <button class="btn-reset" id="btnReset">
                <i class="fas fa-rotate-left"></i>
                <span>重置</span>
            </button>
        </section>

        <section class="result-panel" id="resultPanel" style="display:none;">
            <div class="result-header">
                <h2><i class="fas fa-check-circle"></i> 推荐方案</h2>
                <span class="match-score" id="matchScore">匹配度 98%</span>
            </div>
            <div class="attachments-grid" id="attachmentsGrid"></div>
            <div class="final-stats" id="finalStats">
                <h3>最终属性</h3>
                <div class="final-stats-list" id="finalStatsList"></div>
            </div>
            
        </section>
    </main>

    <div class="loading-mask" id="loadingMask" style="display:none;">
        <div class="loading-spinner"></div>
        <p>AI 分析中...</p>
    </div>

    <div class="toast" id="toast"></div>

    <script src="data/weapons.js"></script>
    <script src="data/attachments.js"></script>
    <script src="data/compatibility.js"></script>
    <script src="script.js"></script>
</body>
</html>
