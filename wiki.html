<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>三角洲行动 · 配件百科</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* 百科页面专用样式 */
        .wiki-header {
            position: sticky; top:0; z-index:100;
            background: linear-gradient(180deg, rgba(18,22,30,0.98) 0%, rgba(26,31,42,0.95) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }
        .wiki-header-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px;
        }
        .wiki-header-top h1 {
            font-size: 18px; font-weight: 700; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px;
        }
        .wiki-header-top .back-btn {
            color: var(--text-dim); text-decoration: none; font-size: 14px;
            display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
        }
        .wiki-header-top .back-btn:hover { color: var(--accent); }

        .search-box {
            position: relative;
        }
        .search-box input {
            width: 100%; padding: 10px 14px 10px 38px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); font-size: 14px;
            outline: none; transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: var(--text-dim); font-size: 14px;
        }
        .search-box .clear-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-size: 12px; display: none;
        }
        .search-box .clear-btn.show { display: block; }

        .category-tabs {
            display: flex; gap: 8px; overflow-x: auto;
            padding: 12px 16px; scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .category-tab {
            flex-shrink: 0; padding: 8px 16px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; color: var(--text-dim); font-size: 13px;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .category-tab:hover { border-color: var(--border-light); color: var(--text); }
        .category-tab.active {
            background: rgba(124,58,237,0.1); border-color: var(--accent);
            color: var(--accent); box-shadow: 0 0 12px var(--accent-glow);
        }

        .wiki-content { padding: 0 16px 24px; max-width: 800px; margin: 0 auto; }

        .attachment-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px;
            margin-bottom: 10px; transition: all 0.2s;
            animation: fadeIn 0.3s ease;
        }
        .attachment-card:hover { border-color: var(--border-light); }

        .att-card-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
        }
        .att-card-icon { font-size: 28px; }
        .att-card-title { flex: 1; }
        .att-card-name { font-size: 15px; font-weight: 600; }
        .att-card-type {
            font-size: 11px; color: var(--text-dim); margin-top: 2px;
            display: inline-block; padding: 2px 8px;
            background: rgba(255,255,255,0.04); border-radius: 10px;
        }

        .att-card-stats {
            display: flex; flex-wrap: wrap; gap: 8px;
        }
        .att-stat-tag {
            font-size: 12px; padding: 5px 10px; border-radius: 8px;
            background: var(--bg); border: 1px solid var(--border);
            display: flex; align-items: center; gap: 4px;
        }
        .att-stat-tag.positive { color: var(--success); border-color: rgba(16,185,129,0.2); }
        .att-stat-tag.negative { color: var(--danger); border-color: rgba(239,68,68,0.2); }
        .att-stat-tag .stat-icon { font-size: 10px; opacity: 0.7; }

        .att-card-tuning {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .att-card-tuning-label {
            font-size: 11px; color: var(--text-dim); margin-bottom: 6px;
        }
        .att-card-tuning-list {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .tuning-tag {
            font-size: 11px; padding: 4px 10px;
            background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.15);
            border-radius: 8px; color: var(--accent);
        }

        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--text-dim);
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
        .empty-state p { font-size: 14px; }

        .result-count {
            font-size: 12px; color: var(--text-dim);
            padding: 0 16px 8px; max-width: 800px; margin: 0 auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 武器百科样式 ========== */
        .mode-tabs {
            display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
            scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .mode-tabs::-webkit-scrollbar { display: none; }
        .mode-tab {
            flex-shrink: 0; padding: 10px 22px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; color: var(--text-dim); font-size: 14px;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            font-weight: 500;
        }
        .mode-tab:hover { border-color: var(--border-light); color: var(--text); }
        .mode-tab.active {
            background: rgba(124,58,237,0.1); border-color: var(--accent);
            color: var(--accent); box-shadow: 0 0 12px var(--accent-glow);
            font-weight: 600;
        }

        .weapon-wiki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .weapon-wiki-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px;
            transition: all 0.2s; animation: fadeIn 0.3s ease;
            display: flex; flex-direction: column; gap: 10px;
        }
        .weapon-wiki-card:hover {
            border-color: var(--border-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .ww-header {
            display: flex; align-items: center; gap: 10px;
        }
        .ww-icon {
            font-size: 32px; line-height: 1;
        }
        .ww-title {
            flex: 1; min-width: 0;
        }
        .ww-name {
            font-size: 16px; font-weight: 700; color: var(--text);
        }
        .ww-type {
            font-size: 11px; color: var(--text-dim); margin-top: 2px;
        }

        .ww-tags {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .mini-tag {
            font-size: 11px; padding: 2px 10px;
            background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.15);
            border-radius: 10px; color: var(--accent);
            white-space: nowrap;
        }

        .ww-stats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
        }
        .ww-stat {
            font-size: 12px; padding: 6px 8px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; display: flex; justify-content: space-between;
            align-items: center; gap: 4px;
        }
        .ww-stat span:first-child {
            font-weight: 500; white-space: nowrap;
        }
        .ww-stat span:last-child {
            font-weight: 600; color: var(--text);
        }

        .ww-extra {
            display: flex; flex-wrap: wrap; gap: 8px;
            padding-top: 8px; border-top: 1px solid var(--border);
        }
        .ww-extra span {
            font-size: 12px; color: var(--text-dim);
            padding: 3px 10px; background: rgba(255,255,255,0.03);
            border-radius: 6px; white-space: nowrap;
        }
    </style>
</head>
<body>
    <header class="wiki-header">
        <div class="wiki-header-top">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回改枪</a>
            <h1 id="wikiTitle"><i class="fas fa-book" style="color:var(--accent)"></i> 配件百科</h1>
            <span style="width:60px"></span>
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="搜索配件名称...">
            <button class="clear-btn" id="clearSearch"><i class="fas fa-times"></i></button>
        </div>
    </header>

    <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="attachment">配件百科</button>
        <button class="mode-tab" data-mode="weapon">武器百科</button>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="result-count" id="resultCount"></div>
    <main class="wiki-content" id="wikiContent"></main>

    <script src="data/weapons.js"></script>
    <script src="data/attachments.js"></script>
    <script src="data/compatibility.js"></script>
    <script src="script.js"></script>
    <script>
    (function() {
        // ========== 当前模式 ==========
        let currentMode = 'attachment'; // 'attachment' | 'weapon'
        let ACCESSORY_IMAGES = {};
        fetch('data/accessory_images.json')
            .then(r => r.json())
            .then(data => { ACCESSORY_IMAGES = data; })
            .catch(() => {});

        // ========== 配件百科数据 ==========
        const slotNameMap = {
            muzzle: '枪口', barrel: '枪管', optic: '瞄具',
            foregrip: '前握把', rear_grip: '后握把', mag: '弹匣',
            stock: '枪托', functional: '功能配件', handguard: '护木'
        };

        const ALL_ATTACHMENTS_FLAT = [];
        Object.entries(ATTACHMENTS).forEach(([slot, list]) => {
            list.forEach(att => {
                if (att.id.endsWith('_none')) return;
                ALL_ATTACHMENTS_FLAT.push({ ...att, slot, slotName: slotNameMap[slot] || slot });
            });
        });

        const categories = [
            { key: 'all', name: '全部' },
            { key: 'muzzle', name: '枪口' },
            { key: 'barrel', name: '枪管' },
            { key: 'optic', name: '瞄具' },
            { key: 'foregrip', name: '前握把' },
            { key: 'rear_grip', name: '后握把' },
            { key: 'mag', name: '弹匣' },
            { key: 'stock', name: '枪托' },
            { key: 'functional', name: '功能配件' },
            { key: 'handguard', name: '护木' }
        ];

        let currentCategory = 'all';
        let searchQuery = '';

        const statKeyMap = {
            recoil: { name: '后坐力', icon: 'fa-arrows-alt-v', color: '#ef4444' },
            stability: { name: '稳定性', icon: 'fa-bullseye', color: '#3b82f6' },
            control: { name: '操控', icon: 'fa-running', color: '#22c55e' },
            range: { name: '射程', icon: 'fa-ruler-horizontal', color: '#f59e0b' },
            hipfire: { name: '腰射', icon: 'fa-crosshairs', color: '#a855f7' },
            armor: { name: '穿甲', icon: 'fa-shield-alt', color: '#e67e22' }
        };

        // ========== 武器百科数据 ==========
        const weaponTypes = [
            { key: 'all', name: '全部' },
            { key: '步枪', name: '步枪' },
            { key: '冲锋枪', name: '冲锋枪' },
            { key: '狙击步枪', name: '狙击步枪' },
            { key: '精确射手步枪', name: '精确射手步枪' },
            { key: '霰弹枪', name: '霰弹枪' },
            { key: '轻机枪', name: '轻机枪' },
            { key: '手枪', name: '手枪' },
            { key: '特殊武器', name: '特殊武器' }
        ];

        let currentWeaponType = 'all';
        let weaponSearchQuery = '';

        // 构建 STAT_CONFIG 的快速查询 map
        const statConfigMap = {};
        if (typeof STAT_CONFIG !== 'undefined') {
            STAT_CONFIG.forEach(s => { statConfigMap[s.key] = s; });
        }

        function initWiki() {
            renderModeTabs();
            renderTabs();
            renderContent();
            bindEvents();
        }

        // ========== 模式切换 ==========
        function renderModeTabs() {
            const tabs = document.getElementById('modeTabs');
            tabs.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === currentMode);
            });
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            renderModeTabs();
            renderTabs();
            updateSearchPlaceholder();
            renderContent();
            updateTitle();
        }

        function updateSearchPlaceholder() {
            const input = document.getElementById('searchInput');
            if (currentMode === 'weapon') {
                input.placeholder = '搜索武器名称...';
            } else {
                input.placeholder = '搜索配件名称...';
            }
        }

        function updateTitle() {
            const title = document.getElementById('wikiTitle');
            if (currentMode === 'weapon') {
                title.innerHTML = '<i class="fas fa-crosshairs" style="color:var(--accent)"></i> 武器百科';
            } else {
                title.innerHTML = '<i class="fas fa-book" style="color:var(--accent)"></i> 配件百科';
            }
        }

        // ========== 分类标签 ==========
        function renderTabs() {
            const tabs = document.getElementById('categoryTabs');

            if (currentMode === 'weapon') {
                tabs.innerHTML = weaponTypes.map(c => `
                    <button class="category-tab ${c.key === currentWeaponType ? 'active' : ''}" data-key="${c.key}">
                        ${c.name}
                    </button>
                `).join('');
            } else {
                tabs.innerHTML = categories.map(c => `
                    <button class="category-tab ${c.key === currentCategory ? 'active' : ''}" data-key="${c.key}">
                        ${c.name}
                    </button>
                `).join('');
            }

            tabs.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    if (currentMode === 'weapon') {
                        currentWeaponType = tab.dataset.key;
                    } else {
                        currentCategory = tab.dataset.key;
                    }
                    renderTabs();
                    renderContent();
                });
            });
        }

        // ========== 渲染内容 ==========
        function renderContent() {
            if (currentMode === 'weapon') {
                renderWeaponWiki();
            } else {
                renderAttachments();
            }
        }

        // ========== 配件百科渲染 ==========
        function renderAttachments() {
            const container = document.getElementById('wikiContent');
            const countEl = document.getElementById('resultCount');

            let items = ALL_ATTACHMENTS_FLAT;

            if (currentCategory !== 'all') {
                items = items.filter(a => a.slot === currentCategory);
            }

            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                items = items.filter(a => a.name.toLowerCase().includes(q));
            }

            countEl.textContent = `共 ${items.length} 个配件`;

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>未找到匹配的配件</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(att => {
                const statsHtml = Object.entries(att.stats || {})
                    .filter(([k, v]) => v !== 0)
                    .map(([k, v]) => {
                        const info = statKeyMap[k] || { name: k, icon: '', color: '#fff' };
                        const cls = v > 0 ? 'positive' : 'negative';
                        const sign = v > 0 ? '+' : '';
                        return `<div class="att-stat-tag ${cls}">
                            <i class="fas ${info.icon} stat-icon"></i>
                            <span>${info.name} ${sign}${v}</span>
                        </div>`;
                    }).join('');

                const imgUrl = ACCESSORY_IMAGES[att.name];
                const iconHtml = imgUrl
                    ? `<img src="${imgUrl}" alt="${att.name}" style="width:48px;height:48px;border-radius:4px;object-fit:contain;background:rgba(255,255,255,0.05);" onerror="this.style.display='none';this.nextElementSibling.style.display='block';" loading="lazy"><span class="att-card-icon" style="display:none">${att.emoji}</span>`
                    : `<span class="att-card-icon">${att.emoji}</span>`;

                const tuningHtml = (att.tuning && att.tuning.length > 0)
                    ? `<div class="att-card-tuning">
                        <div class="att-card-tuning-label">精校选项</div>
                        <div class="att-card-tuning-list">
                            ${att.tuning.map(t => `<span class="tuning-tag">${t.name}</span>`).join('')}
                        </div>
                    </div>`
                    : '';

                return `
                <div class="attachment-card">
                    <div class="att-card-header">
                        ${iconHtml}
                        <div class="att-card-title">
                            <div class="att-card-name">${att.name}</div>
                            <span class="att-card-type">${att.slotName}</span>
                        </div>
                    </div>
                    <div class="att-card-stats">
                        ${statsHtml || '<span style="color:var(--text-dim);font-size:12px;">无属性变化</span>'}
                    </div>
                    ${tuningHtml}
                </div>
                `;
            }).join('');
        }

        // ========== 武器百科渲染 ==========
        function renderWeaponWiki() {
            const container = document.getElementById('wikiContent');
            const countEl = document.getElementById('resultCount');

            let items = (typeof WEAPONS !== 'undefined') ? WEAPONS : [];

            if (currentWeaponType !== 'all') {
                items = items.filter(w => w.type === currentWeaponType);
            }

            if (weaponSearchQuery.trim()) {
                const q = weaponSearchQuery.toLowerCase();
                items = items.filter(w => w.name.toLowerCase().includes(q));
            }

            countEl.textContent = `共 ${items.length} 把武器`;

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>未找到匹配的武器</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="weapon-wiki-grid">
                    ${items.map(w => renderWeaponCard(w)).join('')}
                </div>
            `;
        }

        const statShortNameMap = {
            recoil: '后坐力', stability: '稳定', control: '操控',
            range: '射程', hipfire: '腰射', armor: '穿甲'
        };

        function renderWeaponCard(w) {
            const statsHtml = Object.entries(w.baseStats || {}).map(([key, val]) => {
                const cfg = statConfigMap[key];
                const shortName = statShortNameMap[key] || (cfg ? cfg.name : key);
                const color = cfg ? cfg.color : '#fff';
                return `<div class="ww-stat"><span style="color:${color}">${shortName}</span><span>${val}</span></div>`;
            }).join('');

            const tagsHtml = (w.tags || []).map(t => `<span class="mini-tag">${t}</span>`).join('');

            const caliberStr = w.caliber ? ` · ${w.caliber}` : '';

            return `
            <div class="weapon-wiki-card">
                <div class="ww-header">
                    <span class="ww-icon">${w.emoji || '🔫'}</span>
                    <div class="ww-title">
                        <div class="ww-name">${w.name}</div>
                        <div class="ww-type">${w.type}${caliberStr}</div>
                    </div>
                </div>
                <div class="ww-tags">${tagsHtml}</div>
                <div class="ww-stats">${statsHtml}</div>
                <div class="ww-extra">
                    <span>伤害: ${w.baseDamage}</span>
                    <span>射速: ${w.rpm} RPM</span>
                    <span>弹容: ${w.magCapacity}发</span>
                </div>
            </div>`;
        }

        // ========== 事件绑定 ==========
        function bindEvents() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearch');

            input.addEventListener('input', () => {
                const val = input.value;
                if (currentMode === 'weapon') {
                    weaponSearchQuery = val;
                } else {
                    searchQuery = val;
                }
                clearBtn.classList.toggle('show', val.length > 0);
                renderContent();
            });

            clearBtn.addEventListener('click', () => {
                input.value = '';
                if (currentMode === 'weapon') {
                    weaponSearchQuery = '';
                } else {
                    searchQuery = '';
                }
                clearBtn.classList.remove('show');
                renderContent();
            });

            // 模式切换
            document.getElementById('modeTabs').addEventListener('click', (e) => {
                const tab = e.target.closest('.mode-tab');
                if (!tab) return;
                const mode = tab.dataset.mode;
                if (mode) {
                    switchMode(mode);
                }
            });
        }

        initWiki();
    })();
    </script>
</body>
</html>
